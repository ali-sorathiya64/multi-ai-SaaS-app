services:
   backend:
    build: ./server
    container_name: saas-backend
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"

   client:
    build: ./client
    container_name: saas_frontend
    restart: always
    env_file:
      - ./client/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
